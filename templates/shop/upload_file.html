{% extends 'base.html' %}

{% block content %}
<section class="inner-page">
    <div class="container">
        <h1>{{ title }}</h1>

        <form action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Отправить</button>
        </form>
    </div>
</section>
{% endblock %}
