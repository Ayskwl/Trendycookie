{% extends 'base.html' %}

{% block content %}
<section class="inner-page">
    <div class="container">
        <h1>{{ title }}</h1>

        <p>Вы действительно хотите удалить печенье "{{ cookie.name }}"?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit">Удалить</button>
            <a href="{% url 'catalog' %}">Отмена</a>
        </form>
    </div>
</section>
{% endblock %}
